name: Térképadatok havi frissítése

on:
  schedule:
    - cron: '23 1 3 * *'    # minden hónap 3-án, éjjel
  push:
    branches: [main]
    paths: ['only.txt']   # próbafuttatás: az only.txt-ben felsorolt tételek
  workflow_dispatch:
    inputs:
      only:
        description: 'Csak ezek (vesszővel, pl. HU-DB,DE,AT) – üresen minden'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.p.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: p
        env:
          ONLY: ${{ github.event.inputs.only }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "push" ]; then export ONLY="$(cat only.txt)"; fi
          curl -4 -fsSL --retry 5 --retry-delay 20 --retry-all-errors -A "osm-poi-builder/1.0 (+https://github.com/${{ github.repository }})" -o geofabrik-index.json https://download.geofabrik.de/index-v1-nogeom.json
          python3 scripts/plan.py geofabrik-index.json >> "$GITHUB_OUTPUT"

  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJson(needs.plan.outputs.matrix) }}
    name: ${{ matrix.job }}-${{ matrix.cc }}
    steps:
      - uses: actions/checkout@v4
      - name: Hely felszabadítása
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
      - name: Eszközök
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
          pip install --quiet osmium
      - name: Letöltés (Geofabrik)
        run: |
          sudo mkdir -p /mnt/w && sudo chown "$USER" /mnt/w
          curl -4 -fL --retry 5 --retry-delay 30 --retry-all-errors -A "osm-poi-builder/1.0 (+https://github.com/${{ github.repository }})" -o /mnt/w/in.osm.pbf "${{ matrix.url }}"
          ls -la /mnt/w
      - name: Szűrés
        run: |
          osmium tags-filter /mnt/w/in.osm.pbf \
            nwr/amenity=pharmacy,doctors,clinic,dentist,hospital,post_office,atm,bank,fuel,charging_station,restaurant,cafe,fast_food,pub,school,kindergarten,parking \
            nwr/shop=supermarket,convenience,greengrocer,bakery nwr/leisure=playground \
            nwr/tourism=attraction,viewpoint,museum,picnic_site,hotel,guest_house,apartment,hostel,camp_site \
            nwr/historic=castle,monument nwr/natural=peak,spring,cave_entrance nwr/tower:type=observation \
            -o /mnt/w/f.osm.pbf --overwrite
          rm /mnt/w/in.osm.pbf
      - name: Feldolgozás
        run: |
          mkdir -p out
          if [ "${{ matrix.job }}" = "hu" ]; then
            python3 scripts/build.py hu /mnt/w/f.osm.pbf out
          else
            python3 scripts/build.py com "${{ matrix.cc }}" /mnt/w/f.osm.pbf out
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: out-${{ matrix.job }}-${{ matrix.cc }}
          path: out/
          retention-days: 5

  publish:
    needs: build
    if: ${{ always() && needs.build.result != 'cancelled' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: art
          pattern: out-*
          merge-multiple: true
      - name: Közzététel
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view data-latest >/dev/null 2>&1 || gh release create data-latest --title "Térképadatok" --notes "Havonta frissülő kivonat. Adat: © OpenStreetMap közreműködők, ODbL."
          gh release download data-latest -p manifest.json -O old-manifest.json 2>/dev/null || true
          python3 scripts/manifest.py art old-manifest.json
          ls art/*.gz.info.json >/dev/null 2>&1 || { echo "Nincs új fájl."; exit 1; }
          for f in art/*.gz; do [ -f "$f.info.json" ] && gh release upload data-latest "$f" --clobber; done
          gh release upload data-latest art/manifest.json --clobber
